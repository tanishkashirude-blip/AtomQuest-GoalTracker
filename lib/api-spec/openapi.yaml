openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Goal Setting and Tracking Portal API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: goals
    description: Goal management
  - name: checkins
    description: Manager check-in comments
  - name: users
    description: User management (admin)
  - name: dashboard
    description: Dashboard summaries
  - name: reports
    description: Reports and exports

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Invalid credentials

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout current user
      responses:
        "200":
          description: Logged out

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Not authenticated

  /goals:
    get:
      operationId: listGoals
      tags: [goals]
      summary: List goals for current user
      responses:
        "200":
          description: Goals list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Goal"
    post:
      operationId: createGoal
      tags: [goals]
      summary: Create a new goal (employee)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalInput"
      responses:
        "201":
          description: Goal created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
        "400":
          description: Validation error

  /goals/team:
    get:
      operationId: listTeamGoals
      tags: [goals]
      summary: List all goals for manager's team
      responses:
        "200":
          description: Team goals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Goal"

  /goals/all:
    get:
      operationId: listAllGoals
      tags: [goals]
      summary: List all goals across the organization (admin)
      parameters:
        - name: userId
          in: query
          schema:
            type: ["integer", "null"]
        - name: status
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: All goals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Goal"

  /goals/{id}:
    get:
      operationId: getGoal
      tags: [goals]
      summary: Get a single goal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Goal details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
        "404":
          description: Goal not found
    put:
      operationId: updateGoal
      tags: [goals]
      summary: Update a goal (employee, if not locked)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalUpdate"
      responses:
        "200":
          description: Goal updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
        "403":
          description: Goal is locked
        "404":
          description: Not found
    delete:
      operationId: deleteGoal
      tags: [goals]
      summary: Delete a goal (employee, if draft)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "403":
          description: Cannot delete
        "404":
          description: Not found

  /goals/{id}/quarterly:
    patch:
      operationId: updateQuarterly
      tags: [goals]
      summary: Update quarterly achievement for a goal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuarterlyUpdate"
      responses:
        "200":
          description: Quarterly updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"

  /goals/{id}/approve:
    patch:
      operationId: approveGoal
      tags: [goals]
      summary: Approve or reject a goal (manager)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalInput"
      responses:
        "200":
          description: Goal approval status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"

  /goals/{id}/unlock:
    patch:
      operationId: unlockGoal
      tags: [goals]
      summary: Unlock a goal for editing (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Goal unlocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"

  /goals/{id}/checkins:
    get:
      operationId: listCheckins
      tags: [checkins]
      summary: List check-in comments for a goal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Check-ins list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Checkin"
    post:
      operationId: addCheckin
      tags: [checkins]
      summary: Add a check-in comment (manager)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckinInput"
      responses:
        "201":
          description: Check-in added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Checkin"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users (admin)
      responses:
        "200":
          description: Users list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a new user (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}:
    put:
      operationId: updateUser
      tags: [users]
      summary: Update a user (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete a user (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Dashboard summary for current user
      responses:
        "200":
          description: Summary data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/team:
    get:
      operationId: getTeamDashboard
      tags: [dashboard]
      summary: Team dashboard for manager
      responses:
        "200":
          description: Team summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamDashboard"

  /dashboard/admin:
    get:
      operationId: getAdminDashboard
      tags: [dashboard]
      summary: Organization-wide dashboard for admin
      responses:
        "200":
          description: Admin summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDashboard"

  /reports/export:
    get:
      operationId: exportReport
      tags: [reports]
      summary: Export goals report as JSON (admin)
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [json, csv]
            default: json
      responses:
        "200":
          description: Report data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportData"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    AuthUser:
      type: object
      required: [id, email, name, role]
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [employee, manager, admin]
        managerId:
          type: ["integer", "null"]

    User:
      type: object
      required: [id, email, name, role]
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [employee, manager, admin]
        managerId:
          type: ["integer", "null"]
        managerName:
          type: ["string", "null"]
        createdAt:
          type: string

    UserInput:
      type: object
      required: [email, name, role, password]
      properties:
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [employee, manager, admin]
        password:
          type: string
        managerId:
          type: ["integer", "null"]

    UserUpdate:
      type: object
      properties:
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [employee, manager, admin]
        password:
          type: string
        managerId:
          type: ["integer", "null"]

    Goal:
      type: object
      required: [id, userId, title, description, weightage, status, q1Achievement, q2Achievement, q3Achievement, q4Achievement, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        userName:
          type: ["string", "null"]
        userEmail:
          type: ["string", "null"]
        title:
          type: string
        description:
          type: string
        weightage:
          type: number
        status:
          type: string
          enum: [draft, pending_approval, approved, rejected, locked]
        q1Achievement:
          type: ["string", "null"]
        q2Achievement:
          type: ["string", "null"]
        q3Achievement:
          type: ["string", "null"]
        q4Achievement:
          type: ["string", "null"]
        managerComment:
          type: ["string", "null"]
        rejectionReason:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: ["string", "null"]

    GoalInput:
      type: object
      required: [title, description, weightage]
      properties:
        title:
          type: string
        description:
          type: string
        weightage:
          type: number

    GoalUpdate:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        weightage:
          type: number

    QuarterlyUpdate:
      type: object
      properties:
        q1Achievement:
          type: ["string", "null"]
        q2Achievement:
          type: ["string", "null"]
        q3Achievement:
          type: ["string", "null"]
        q4Achievement:
          type: ["string", "null"]

    ApprovalInput:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [approve, reject]
        comment:
          type: string
        rejectionReason:
          type: string

    Checkin:
      type: object
      required: [id, goalId, managerId, comment, createdAt]
      properties:
        id:
          type: integer
        goalId:
          type: integer
        managerId:
          type: integer
        managerName:
          type: ["string", "null"]
        comment:
          type: string
        createdAt:
          type: string

    CheckinInput:
      type: object
      required: [comment]
      properties:
        comment:
          type: string

    DashboardSummary:
      type: object
      required: [totalGoals, totalWeightage, approvedGoals, pendingGoals, rejectedGoals, draftGoals]
      properties:
        totalGoals:
          type: integer
        totalWeightage:
          type: number
        approvedGoals:
          type: integer
        pendingGoals:
          type: integer
        rejectedGoals:
          type: integer
        draftGoals:
          type: integer
        lockedGoals:
          type: integer

    TeamDashboard:
      type: object
      required: [totalEmployees, totalGoals, approvedGoals, pendingApproval, employeeStats]
      properties:
        totalEmployees:
          type: integer
        totalGoals:
          type: integer
        approvedGoals:
          type: integer
        pendingApproval:
          type: integer
        rejectedGoals:
          type: integer
        employeeStats:
          type: array
          items:
            $ref: "#/components/schemas/EmployeeStat"

    EmployeeStat:
      type: object
      required: [userId, userName, totalGoals, totalWeightage, approvedGoals, pendingGoals]
      properties:
        userId:
          type: integer
        userName:
          type: string
        totalGoals:
          type: integer
        totalWeightage:
          type: number
        approvedGoals:
          type: integer
        pendingGoals:
          type: integer

    AdminDashboard:
      type: object
      required: [totalUsers, totalGoals, approvedGoals, pendingApproval, byRole, byStatus]
      properties:
        totalUsers:
          type: integer
        totalGoals:
          type: integer
        approvedGoals:
          type: integer
        pendingApproval:
          type: integer
        byRole:
          type: object
          properties:
            employee:
              type: integer
            manager:
              type: integer
            admin:
              type: integer
        byStatus:
          type: object
          properties:
            draft:
              type: integer
            pending_approval:
              type: integer
            approved:
              type: integer
            rejected:
              type: integer
            locked:
              type: integer

    ReportData:
      type: object
      required: [generatedAt, totalGoals, goals]
      properties:
        generatedAt:
          type: string
        totalGoals:
          type: integer
        goals:
          type: array
          items:
            $ref: "#/components/schemas/Goal"
